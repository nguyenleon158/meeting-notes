<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetNote AI — Smart Meeting Note-Taker</title>
  <meta name="description" content="Local-first AI meeting note-taker with real-time transcription, automated summaries, and action tracking. Data is stored on-device; configured AI providers may process audio or transcript text.">
  <meta name="theme-color" content="#002d31">
  <meta property="og:title" content="MeetNote AI — Smart Meeting Note-Taker">
  <meta property="og:description" content="Local-first meeting notes with on-device storage and optional AI integrations.">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css?v=20260827-1">
  <link rel="stylesheet" href="css/base.css?v=20260827-1">
  <link rel="stylesheet" href="css/components.css?v=20260827-1">
  <link rel="stylesheet" href="css/layout.css?v=20260827-1">
  <link rel="stylesheet" href="css/animations.css?v=20260827-1">

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%23dc143c'/><text x='50' y='68' text-anchor='middle' font-size='50' fill='white'>🎙</text></svg>">
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🎙️</div>
        <div class="sidebar-brand">Meet<span>Note</span> AI</div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Menu</div>

        <a class="nav-item nav-item-new" data-route="new" id="nav-new">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          New Meeting
        </a>

        <div class="nav-divider"></div>

        <a class="nav-item active" data-route="dashboard" id="nav-dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>

        <a class="nav-item" data-route="meetings" id="nav-meetings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          All Meetings
          <span class="nav-badge" id="nav-meetings-count" style="display:none"></span>
        </a>

        <a class="nav-item" data-route="usage" id="nav-usage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-7"/></svg>
          Usage Log
        </a>

        <a class="nav-item" data-route="search" id="nav-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Search
        </a>

        <div class="nav-section-label" style="margin-top: var(--space-4)">System</div>

        <a class="nav-item" data-route="settings" id="nav-settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>

        <a class="nav-item" data-route="report-bug" id="nav-report-bug">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l1 4H7l1-4Z"/><rect x="5" y="6" width="14" height="15" rx="3"/><path d="M2 13h3M19 13h3M9 11v5M15 11v5"/></svg>
          Report a Bug
        </a>
      </nav>

      <div class="sidebar-footer">
        <div style="font-size: var(--text-xs); color: var(--text-tertiary);">
          💾 Stored locally on this device
        </div>
      </div>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main">
      <header class="main-header">
        <div class="main-header-left">
          <button class="mobile-toggle btn-icon btn-ghost" id="mobile-toggle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="main-header-right">
          <div id="header-actions"></div>
          <button class="btn btn-ghost btn-icon" id="theme-toggle" title="Switch to light mode" aria-label="Switch theme">☀️</button>
        </div>
      </header>

      <div class="main-content" id="main-content">
        <!-- Dynamic content rendered here by app.js -->
      </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal Backdrop -->
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal" id="modal"></div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js?v=20260827-1"></script>
  <script src="js/storage.js?v=20260827-1"></script>
  <script src="js/audio-storage.js?v=20260827-1"></script>
  <script src="js/recorder.js?v=20260827-1"></script>
  <script src="js/transcriber.js?v=20260827-1"></script>
  <script src="js/summary.js?v=20260827-1"></script>
  <script src="js/export.js?v=20260827-1"></script>
  <script src="js/app.js?v=20260827-1"></script>
</body>
</html>
