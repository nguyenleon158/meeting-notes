name: Bug report
description: Report a reproducible problem without sharing private meeting data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach recordings, transcripts, summaries, API keys, private meeting details, or diagnostic JSON to this public issue. Report security issues privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: MeetNote version
      placeholder: "1.1.1"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without including private meeting content.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Choose…
        3. See…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional non-sensitive context
      description: Add sanitized screenshots or error text only if they contain no private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirmed this issue contains no recordings, transcripts, API keys, private meeting data, or diagnostic JSON.
          required: true
